    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：英國數位政府債券（DIGIT）試點發行進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-10-07　最近更新：2026-10-07　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-10-07　英國政府於10月6日選定6家銀行擔任DIGIT試點發行聯合主辦行，預計2027年第一季發行</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">英國政府選定6家銀行擔任數位政府債券DIGIT試點發行的聯合主辦行，試點將測試分散式帳本與鏈上結算，預計2027年第一季前發行。</p>
