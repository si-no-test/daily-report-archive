<body>
  <div style="max-width:700px;margin:0 auto;">
    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：美國金融科技取得聯準會支付軌道接取（PACE法案）進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-10-07　最近更新：2026-10-07　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-10-07　Stripe於9月25日在費城聯準會金融科技年會上呼籲開放聯準會支付軌道，並與Ramp共同支持PACE法案</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">Stripe與Ramp在費城聯準會年會上主張非銀行業者應可接取Fedwire、FedNow與FedACH；PACE法案無參議院版本，本屆國會通過機會有限。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.paymentsdive.com/news/fintechs-press-for-fed-access/832233/" style="color:#2471a3;text-decoration:none;">Fintechs press for Fed access</a></div>
        </div>
  </div>
