<body>
  <div style="max-width:700px;margin:0 auto;">
    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：CFTC事件合約納入交換定義的規則制定與州法院訴訟</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-10-10　最近更新：2026-10-10　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-10-10　CFTC發布暫行最終規則並提出規則草案，把事件合約納入交換定義</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">10月9日CFTC發布暫行最終規則（賭場式賭博不屬交換）並提出規則草案（事件合約屬交換，意見期30天），州政府與最高法院訴訟並行。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.coindesk.com/policy/2026/10/09/u-s-cftc-moves-to-fold-event-contracts-into-swaps-regulations-as-legal-fight-rages" style="color:#2471a3;text-decoration:none;">U.S. CFTC moves to fold event contracts into swaps regulations as legal fight rages</a></div>
