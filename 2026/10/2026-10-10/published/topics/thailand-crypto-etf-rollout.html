<body>
  <div style="max-width:700px;margin:0 auto;">
    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：泰國本地比特幣與以太幣ETF開放進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-10-10　最近更新：2026-10-10　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-10-10　泰國證券交易委員會發布規則，10月16日起允許本地發行比特幣與以太幣ETF</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">10月8日泰國SEC發布規則，10月16日生效；基金須掛牌於泰國證交所、至少80%淨資產投入單一合格加密資產並使用受監管託管機構。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.coindesk.com/policy/2026/10/09/thailand-opens-door-to-locally-listed-bitcoin-and-ether-etfs" style="color:#2471a3;text-decoration:none;">Thailand opens door to locally listed bitcoin and ether ETFs</a></div>
        </div>
  </div>
