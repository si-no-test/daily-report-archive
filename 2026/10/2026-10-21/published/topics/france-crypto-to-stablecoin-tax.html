  <div style="max-width:700px;margin:0 auto;">
    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：法國加密幣換穩定幣課稅修正案立法進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-10-21　最近更新：2026-10-21　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-10-21　法國國民議會於10月16日以38票對37票通過修正案I-3898，擬自2027年起對加密幣換穩定幣課徵31.4%資本利得稅</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">國民議會以一票之差通過取消換入MiCA穩定幣稅負遞延的修正案，仍須通過預算其餘程序，政府部長已要求撤回。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.coindesk.com/policy/2026/10/20/france-s-parliament-approves-vote-to-hit-crypto-to-stablecoin-trades-with-31-levy" style="color:#2471a3;text-decoration:none;">France's parliament approves vote to hit stablecoin trades with 31% capital gains tax</a></div>
