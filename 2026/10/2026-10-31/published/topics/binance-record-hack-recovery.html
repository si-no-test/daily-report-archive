    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：幣安63億美元遭駭事件的補償、凍結與提領恢復進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-10-31　最近更新：2026-10-31　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-10-31　幣安動用逾63.4億美元補償遭駭損失並凍結約30億美元資產</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">10月30日幣安表示以SAFU與公司資金補償所有損失，撥出逾63.4億美元，並與夥伴在鏈上凍結約30億美元；泰達幣與Circle合計凍結約30億美元穩定幣，調查與歸因仍在進行。</p>
