    <p style="color:#777;font-size:12px;">首次追蹤：2026-10-15　最近更新：2026-10-15　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-10-15　Qivalis取得荷蘭電子貨幣機構牌照</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">10月14日Qivalis取得荷蘭央行電子貨幣機構牌照，37家歐洲銀行支持，預計發布白皮書後於數月內發行歐元穩定幣。</p>
