    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-26　最近更新：2026-11-26　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-26　Highnote向OCC與FDIC申設全國性銀行Highnote Bank N.A.</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">11月23日向OCC與FDIC遞件申設「為支付而生」的Highnote Bank N.A.，由前LendingClub風控長Tim Bogan領軍，申請資料尚未公告於OCC網站。</p>
