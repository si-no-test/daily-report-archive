    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：哈薩克央行票據與政府公債代幣化進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-15　最近更新：2026-11-15　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-15　哈薩克國家銀行於11月9日首度標售代幣化票據約2,230萬美元，並規劃明年第一季推出代幣化政府公債</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">哈薩克國家銀行11月9日在KASE標售500億堅戈短期票據，其中100億堅戈以代幣形式並行發行、同價定價，加權平均年殖利率15.72%，哈國規劃明年第一季推出代幣化政府公債。</p>
