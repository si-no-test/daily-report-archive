    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-22　最近更新：2026-11-22　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-22　微軟（Microsoft）於11月17日在Ignite大會宣布推出「AI透明度倡議」，攜手逾40家機構制定跨模型開放標準</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">微軟於Ignite宣布AI透明度倡議，擴大參與NIST代理標準倡議，並與萬事達卡、畢馬威等逾40家機構制定跨模型的AI代理問責與獨立驗證開放標準。</p>
