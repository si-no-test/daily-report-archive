  <div style="max-width:700px;margin:0 auto;">
    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：歐洲央行Appia代幣化金融生態系藍圖與聯合實驗進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-22　最近更新：2026-11-22　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-22　歐洲央行（ECB）於11月20日邀請市場參與者組成聯合倡議加入Appia代幣化實驗，首批申請截止日為12月11日</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">歐洲央行邀市場以聯合倡議形式加入Appia三大設計流（代幣化存款、代幣化證券、共享網路治理）實驗，首批申請12月11日截止、其後滾動審查。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.ecb.europa.eu/press/intro/news/html/ecb.mipnews261120.en.html" style="color:#2471a3;text-decoration:none;">Eurosystem invites market participants to join Appia analytical and practical work</a></div>
        </div>
  </div>
