    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：巴西證交所B3里爾穩定幣分階段推出進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-28　最近更新：2026-11-28　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-28　巴西證券交易所（B3）於11月27日宣布聯手六家大型金融機構推出與里爾1:1掛鉤的穩定幣，最快2027年第一季上線</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">Banco B3將發行里爾1:1準備的穩定幣，其他金融機構可自上線起加入，上線時程延至最快2027年第一季。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.coindesk.com/business/2026/11/27/brazil-s-stock-exchange-teams-up-with-major-banks-to-launch-real-pegged-stablecoin" style="color:#2471a3;text-decoration:none;">Brazil’s stock exchange teams up with major banks to launch real-pegged stablecoin</a></div>
