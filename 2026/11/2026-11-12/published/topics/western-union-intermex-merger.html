    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：西聯匯款收購Intermex案監理與解約爭議</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-12　最近更新：2026-11-12　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-12　西聯匯款以加州監理條件為由終止5億美元收購Intermex，Intermex拒絕解約</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">加州DFPI於11月10日附條件核准（不得縮減代理據點、強化反詐騙與洗錢防制），西聯同日於退出期限終止協議，Intermex於11月11日要求完成合併，雙方轉入法律攻防。</p>
