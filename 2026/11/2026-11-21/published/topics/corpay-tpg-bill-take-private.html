    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-21　最近更新：2026-11-21　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-21　TPG與Corpay宣布以約60億美元私有化Bill</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">11月19日TPG與Corpay宣布以每股63.25美元、約60億美元現金私有化Bill，Corpay出資11億美元取得33%股權並握有2030年前全數收購選擇權，預計明年上半年完成交易。</p>
