  <div style="max-width:700px;margin:0 auto;">
    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：加拿大即時支付系統Real-Time Rail分階段上線</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-11　最近更新：2026-11-11　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-11　加拿大支付協會啟用即時支付系統Real-Time Rail，強制內建收款人確認與交易風險評分</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">11月10日：加拿大支付協會啟用RTR，首批由Wealthsimple、KOHO、美國銀行等8家機構接入，未來數月納入所有主要金融機構，首年涵蓋逾九成加拿大人，並強制內建收款人確認與交易風險評分。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://finovate.com/canada-launches-real-time-payments-system-the-real-time-rail/" style="color:#2471a3;text-decoration:none;">Canada Launches Real-Time Payments System, the Real-Time Rail</a></div>
