  <div style="max-width:700px;margin:0 auto;">
    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：OneMain申設猶他州工業銀行（ILC）進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-19　最近更新：2026-11-19　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-19　OneMain於11月17日取得FDIC核准設立工業銀行</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">FDIC與猶他州金融機構廳核准OneMain的ILC申請，開業資本須至少3.41億美元、槓桿比率不低於15%，須遵循CFPB命令並提交社區再投資策略計畫，預計約一年內開業。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.bankingdive.com/news/onemain-fdic-approves-ilc-charter-subprime-lender-cfpb-13-ag-lawsuit-ncrc/875075/" style="color:#2471a3;text-decoration:none;">OneMain gets FDIC green light for ILC charter</a></div>
