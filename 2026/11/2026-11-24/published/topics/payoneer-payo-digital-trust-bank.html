    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：派安盈PAYO Digital信託銀行與PAYO-USD穩定幣籌設進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-24　最近更新：2026-11-24　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-24　派安盈取得OCC有條件核准設立PAYO Digital信託銀行</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">Payoneer於11月23日取得OCC有條件核准成立PAYO Digital Bank（2月遞件），將發行不上交易所的封閉型穩定幣PAYO-USD，下一步為建置平台與開業檢查；Payoneer預計2027年中併入Nuvei。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.bankingdive.com/news/payoneer-gets-conditional-approval-trust-bank-occ-payo-digital/875506/" style="color:#2471a3;text-decoration:none;">Payoneer gets conditional approval for trust bank</a></div>
