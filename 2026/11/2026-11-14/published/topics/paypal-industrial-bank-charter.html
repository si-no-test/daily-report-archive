  <div style="max-width:700px;margin:0 auto;">
    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：PayPal申設猶他州工業銀行執照進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-14　最近更新：2026-11-14　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-14　PayPal於11月13日經報導說明申設猶他州工業銀行，以存款支撐2,000萬家商戶放款</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">PayPal財務暨營運長Jamie Miller表示，去年12月提出的猶他州工業銀行申請旨在支撐商戶放款並以存款分散資金來源，尚未透露監理機關審查進度。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.paymentsdive.com/news/why-paypal-wants-to-have-a-bank/874615/" style="color:#2471a3;text-decoration:none;">Why PayPal wants to have a bank</a></div>
