<style>

<body>
  <div style="max-width:700px;margin:0 auto;">
    <h1 style="color:#1a3c5e;font-size:22px;border-bottom:2px solid #1a3c5e;padding-bottom:10px;">議題脈絡：墨西哥刷卡手續費上限法規制定進程</h1>
    <p style="color:#777;font-size:12px;">首次追蹤：2026-11-23　最近更新：2026-11-23　共 1 則記錄</p>
    
        <div style="margin-bottom:18px;padding:14px 16px;border-left:3px solid #2471a3;background:#f4f8fc;">
          <div style="color:#1a3c5e;font-weight:bold;font-size:14px;">2026-11-23　墨西哥政府於11月20日公布放寬版刷卡手續費上限草案</div>
          <p style="margin:6px 0 4px 0;color:#333;font-size:13px;line-height:1.6;">修正草案改為2029年前分階段將信用卡與簽帳卡年均上限定為1%與0.3%，較去年0.6%信用卡上限提案寬鬆。</p>
          <div style="font-size:12px;color:#777;">來源：<a href="https://www.pymnts.com/digital-payments/2026/mexico-relaxes-card-fee-rules-to-promote-digital-payments/" style="color:#2471a3;text-decoration:none;">Mexico Relaxes Card Fee Rules to Promote Digital Payments</a></div>
        </div>
  </div>
